<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Yes or No</title>
<style>
  :root {
    --bg: #f4f4f2; --panel: #ffffff; --line: #e6e6e3; --text: #1a1a1a; --muted: #8a8a86; --faint: #b5b5b1;
    --yes: #2f9e6e; --no: #c94f5c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100%;
    display: flex; flex-direction: column; align-items: center; padding: 22vh 20px 80px;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; }
  h1 { margin: 0 0 18px; font-size: 18px; font-weight: 500; letter-spacing: -0.01em; }

  form {
    width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 10px 8px; box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  input {
    width: 100%; background: transparent; border: 0; outline: 0; color: var(--text);
    font: inherit; font-size: 13px; padding: 2px 4px 10px;
  }
  input::placeholder { color: var(--muted); }
  .bar { display: flex; justify-content: space-between; align-items: center; }
  .model { color: var(--muted); font-size: 11px; padding-left: 4px; }
  .model b { font-weight: 500; color: var(--text); }
  button {
    width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--text); color: #fff;
    cursor: pointer; display: grid; place-items: center; padding: 0; transition: opacity .2s;
  }
  button:disabled { opacity: .35; cursor: progress; }
  button svg { width: 11px; height: 11px; }

  #verdict { width: 100%; margin-top: 26px; text-align: center; min-height: 64px; }
  .big { font-size: 34px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.1; animation: fade .4s ease; }
  .big.yes { color: var(--yes); } .big.no { color: var(--no); }
  .sub { color: var(--muted); font-size: 11px; margin-top: 6px; }
  .thinking { color: var(--muted); font-size: 13px; padding-top: 12px; }
  .thinking::after { content: ""; animation: dots 1.2s steps(4, end) infinite; }
  .err { color: var(--no); font-size: 12px; white-space: pre-wrap; }
  @keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  #history { width: 100%; margin-top: 30px; display: flex; flex-direction: column; }
  .row {
    display: flex; align-items: baseline; gap: 12px; padding: 8px 4px; font-size: 12px;
    border-top: 1px solid var(--line); animation: fade .3s ease;
  }
  .row:last-child { border-bottom: 1px solid var(--line); }
  .row .q { flex: 1; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .p { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 11px; }
  .row .a { font-weight: 500; width: 26px; text-align: right; }
  .row .a.yes { color: var(--yes); } .row .a.no { color: var(--no); }
</style>
</head>
<body>
  <main>
    <h1>Yes or No</h1>

    <form id="f" autocomplete="off">
      <input id="q" placeholder="Ask a yes or no question" maxlength="500" autofocus />
      <div class="bar">
        <span class="model" id="model">Jev</span>
        <button id="go" type="submit" aria-label="Ask">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10V2M2.5 5.5 6 2l3.5 3.5"/></svg>
        </button>
      </div>
    </form>

    <div id="verdict"></div>
    <div id="history"></div>
  </main>

<script>
const f = document.getElementById('f'), q = document.getElementById('q'), go = document.getElementById('go');
const verdict = document.getElementById('verdict'), history = document.getElementById('history'), modelEl = document.getElementById('model');
const pct = p => Math.round(p * 100) + '%';
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function confidenceWord(p) {
  const d = Math.abs(p - 0.5);
  if (d > 0.4) return 'very sure';
  if (d > 0.25) return 'fairly sure';
  if (d > 0.1) return 'leaning';
  return 'unsure';
}

f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = q.value.trim();
  if (!question) return;
  go.disabled = true; q.disabled = true;
  verdict.innerHTML = '<div class="thinking">Thinking</div>';
  try {
    const r = await fetch('/ask', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ question }) });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || ('HTTP ' + r.status));
    const cls = d.answer, word = cls === 'yes' ? 'Yes' : 'No';
    verdict.innerHTML = `<div class="big ${cls}">${word}</div>
      <div class="sub">${confidenceWord(d.p_yes)} · ${pct(d.p_yes)} yes</div>`;
    modelEl.innerHTML = `<b>${esc(d.model)}</b>`;
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<div class="q" title="${esc(question)}">${esc(question)}</div>
      <div class="p">${pct(d.p_yes)}</div><div class="a ${cls}">${word}</div>`;
    history.prepend(row);
    q.value = '';
  } catch (err) {
    verdict.innerHTML = `<div class="err">${esc(String(err.message || err))}</div>`;
  } finally {
    go.disabled = false; q.disabled = false; q.focus();
  }
});
</script>
</body>
</html>
